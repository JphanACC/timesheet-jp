<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timesheet Tracker</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <!-- ExcelJS for Excel export (full style support including text wrap) -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="timesheet.css" />
</head>
<body>

<div id="app">

  <!-- ── Top Bar ──────────────────────────────────────────── -->
  <header id="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <line x1="8" y1="14" x2="10" y2="14"/>
        <line x1="14" y1="14" x2="16" y2="14"/>
        <line x1="8" y1="18" x2="10" y2="18"/>
        <line x1="14" y1="18" x2="16" y2="18"/>
      </svg>
      TIMESHEET
      <span id="app-version"></span>
    </div>
    <div class="brand-sep"></div>
    <span class="subtitle">Weekly Time Tracker · Sat → Fri</span>

    <div class="topbar-right">
      <!-- Lookup Toggle -->
      <button id="toggle-lookup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        Min → Decimal
      </button>

      <div class="topbar-sep"></div>

      <!-- Add Row -->
      <button id="add-row-btn" class="btn-ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add Row
      </button>

      <div class="topbar-sep"></div>

      <!-- Save -->
      <button id="save-btn" class="btn-action btn-save" title="Save session to browser storage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Save
      </button>

      <!-- Reset -->
      <button id="reset-btn" class="btn-action btn-reset" title="Clear all entries">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
        </svg>
        Reset
      </button>

      <!-- Export Excel -->
      <button id="export-btn" class="btn-action btn-export" title="Export to Excel (.xlsx)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Export
      </button>
    </div>
  </header>

  <!-- ── Main Area ─────────────────────────────────────────── -->
  <div id="main">

    <!-- Sheet -->
    <div id="sheet-scroll">
      <!-- Populated by timesheetUI.js -->
    </div>

    <!-- Lookup Panel (slide-in) -->
    <aside id="lookup-panel">
      <div class="lookup-inner">
        <div class="lookup-header">
          <span class="lookup-title">Minutes → Decimal</span>
          <button id="close-lookup" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <p class="lookup-desc">
          Remaining minutes after whole hours are converted to decimal using this table.
        </p>
        <table id="lookup-table">
          <thead>
            <tr>
              <th>Minutes</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody id="lookup-tbody">
            <!-- Populated by timesheetUI.js -->
          </tbody>
        </table>
      </div>
    </aside>

  </div><!-- #main -->

</div><!-- #app -->

<!-- Toast container -->
<div id="toast-container"></div>

<!-- App version -->
<script src="version.js"></script>
<!-- Business logic (no DOM dependencies) -->
<script src="timeLogic.js"></script>
<!-- UI logic (requires jQuery + timeLogic.js) -->
<script src="timesheetUI.js"></script>

</body>
</html>
